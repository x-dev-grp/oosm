# New Relic Java agent configuration for OOSM.
# Most settings are overridden by environment variables (NEW_RELIC_*).
# See Administration → Settings → Integrations in OOSM admin.

common: &default_settings
  agent_enabled: true
  app_name: oosm-monolith
  license_key: ''
  log_level: info
  application_logging:
    enabled: true
    forwarding:
      enabled: true
      max_samples_stored: 10000
    metrics:
      enabled: true
    local_decorating:
      enabled: false

production:
  <<: *default_settings

development:
  <<: *default_settings
