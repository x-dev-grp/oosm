server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8084}}
  forward-headers-strategy: framework
  max-http-request-header-size: 32KB
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

spring:
  application:
    name: ${SPRING_APP_NAME:osm-monolith}
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:true}
  jmx:
    enabled: ${SPRING_JMX_ENABLED:false}

  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:osm}}
    username: ${DB_USER:${PGUSER:postgres}}
    password: ${DB_PASS:${PGPASSWORD:root}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO public
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:900000}

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: public
        format_sql: ${FORMAT_SQL:false}
        boot:
          allow_jdbc_metadata_access: ${HIBERNATE_ALLOW_JDBC_METADATA_ACCESS:true}
        envers:
          audit_table_suffix: _aud
          revision_field_name: rev
          revision_type_field_name: revtype
        id:
          db_structure_naming_strategy: standard
      jakarta:
        persistence:
          database-product-name: PostgreSQL
          database-major-version: ${DB_MAJOR_VERSION:17}
          database-minor-version: ${DB_MINOR_VERSION:0}

  sql:
    init:
      mode: always
      schema-locations: classpath:db/oauth2-schema.sql

  data:
    jpa:
      repositories:
        bootstrap-mode: ${JPA_REPOSITORY_BOOTSTRAP_MODE:lazy}
    jdbc:
      dialect: postgresql

  security:
    oauth2:
      resource-server:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:${RENDER_EXTERNAL_URL:http://localhost:8084}/oauth2/jwks}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          timeout: ${MAIL_TIMEOUT:5000}
          connectiontimeout: ${MAIL_CONN_TIMEOUT:5000}

oauth2:
  client:
    id: ${OAUTH2_CLIENT_ID:osm-client}
    secret: ${OAUTH2_CLIENT_SECRET}

otp:
  code:
    length: 6
    expiry:
      minutes: 15
  resend:
    delay:
      minutes: 2
  max:
    attempts: 3

app:
  debug:
    search-on-startup: ${SEARCH_DEBUG_ON_STARTUP:false}
  frontend:
    base-url: ${FRONTEND_ENTRY_POINT:http://localhost:4200}
  cors:
    allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
  internal-base-url: ${INTERNAL_BASE_URL:http://127.0.0.1:${PORT:${SERVER_PORT:8084}}}
  security:
    bootstrap:
      enabled: ${SECURITY_BOOTSTRAP_ENABLED:false}
      username: ${SECURITY_BOOTSTRAP_USERNAME:osmAdmin}
      password: ${SECURITY_BOOTSTRAP_PASSWORD:}
      email: ${SECURITY_BOOTSTRAP_EMAIL:osmAdmin@example.com}
      phone: ${SECURITY_BOOTSTRAP_PHONE:1234567819}

onesignal:
  app-id: ${ONESIGNAL_APP_ID:}
  api-key: ${ONESIGNAL_API_KEY:}
  endpoint: ${ONESIGNAL_ENDPOINT:https://onesignal.com/api/v1/notifications}

qr:
  base-url: ${QR_BASE_URL:https://x-dev.pro/q/v1}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true

logging:
  level:
    com.xdev.ooms.security: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web.client.RestTemplate: ${LOG_LEVEL_REST:WARN}
