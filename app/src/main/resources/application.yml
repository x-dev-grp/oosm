server:
  address: 0.0.0.0
  port: ${PORT:8084}
  forward-headers-strategy: framework
  max-http-request-header-size: 32KB
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:20}
      min-spare: ${TOMCAT_MIN_SPARE_THREADS:2}
    max-connections: ${TOMCAT_MAX_CONNECTIONS:100}
    accept-count: ${TOMCAT_ACCEPT_COUNT:50}
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${SERVER_ERROR_INCLUDE_BINDING_ERRORS:never}

spring:
  application:
    name: ${SPRING_APP_NAME:oosm-monolith}
  config:
    import: optional:classpath:version.properties
  main:
    lazy-initialization: ${SPRING_MAIN_LAZY_INITIALIZATION:true}
    banner-mode: console
  output:
    ansi:
      enabled: detect
  jmx:
    enabled: ${SPRING_JMX_ENABLED:false}

  datasource:
    url: ${DB_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:osm}}
    username: ${DB_USER:${PGUSER:postgres}}
    password: ${DB_PASS:${PGPASSWORD:root}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET search_path TO public
      maximum-pool-size: ${DB_POOL_MAX_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT:10000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:900000}

  flyway:
    enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        default_schema: public
        format_sql: ${FORMAT_SQL:false}
        boot:
          allow_jdbc_metadata_access: ${HIBERNATE_ALLOW_JDBC_METADATA_ACCESS:true}
        id:
          db_structure_naming_strategy: standard
      jakarta:
        persistence:
          database-product-name: PostgreSQL
          database-major-version: ${DB_MAJOR_VERSION:17}
          database-minor-version: ${DB_MINOR_VERSION:0}

  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: classpath:db/oauth2-schema.sql,classpath:db/security-schema-patch.sql,classpath:db/app-settings-schema.sql,classpath:db/tenant-enabled-module-schema.sql

  data:
    jpa:
      repositories:
        bootstrap-mode: ${JPA_REPOSITORY_BOOTSTRAP_MODE:lazy}
    jdbc:
      dialect: postgresql

  security:
    oauth2:
      resource-server:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:${RENDER_EXTERNAL_URL:http://localhost:8084}/oauth2/jwks}

oauth2:
  client:
    id: ${OAUTH2_CLIENT_ID:oosm-client}
    secret: ${OAUTH2_CLIENT_SECRET:}

otp:
  code:
    length: 6
    expiry:
      minutes: 15
  resend:
    delay:
      minutes: 2
  max:
    attempts: 3

# Infrastructure and bootstrap only.
# Operational settings (mail, frontend URL, CORS, QR, OneSignal, log levels, etc.)
# are managed via Administration → Settings using flat env vars as optional bootstrap:
# MAIL_*, SMTP_*, FRONTEND_ENTRY_POINT, APP_CORS_ALLOWED_ORIGIN_PATTERNS,
# ONESIGNAL_*, QR_BASE_URL, LOG_LEVEL_WEB, LOG_LEVEL_REST,
# SPRINGDOC_ENABLED, HEALTH_SHOW_DETAILS, SEARCH_DEBUG_ON_STARTUP
app:
  debug:
    search-on-startup: ${SEARCH_DEBUG_ON_STARTUP:false}
  internal-base-url: ${INTERNAL_BASE_URL:http://127.0.0.1:${PORT:8084}}
  security:
    jwt:
      secret: ${JWT_SECRET:X7kP9mN2vQ8rT4wY6zA1bC3dE5fG8hJ9}
    legacy-user-migration:
      enabled: ${SECURITY_LEGACY_USER_MIGRATION_ENABLED:true}
    bootstrap:
      enabled: ${SECURITY_BOOTSTRAP_ENABLED:true}
      username: ${SECURITY_BOOTSTRAP_USERNAME:oosmAdmin}
      password: ${SECURITY_BOOTSTRAP_PASSWORD:oosmAdmin123+}
      email: ${SECURITY_BOOTSTRAP_EMAIL:oosmAdmin@example.com}
      phone: ${SECURITY_BOOTSTRAP_PHONE:1234567819}
      reset-existing-admin-password: ${SECURITY_BOOTSTRAP_RESET_PASSWORD:true}
    permissions:
      # Always seeds when the permission table is empty. Set true to re-sync on every startup.
      sync-on-startup: ${PERMISSIONS_SYNC_ON_STARTUP:false}
  settings:
    # Encrypts secrets stored in app_setting. Not exposed in admin UI (infrastructure).
    encryption-key: ${APP_SETTINGS_ENCRYPTION_KEY:${app.security.jwt.secret:oosm-local-app-settings-encryption-key-32b}}
    rate-limit:
      mail-test-per-hour: ${ADMIN_SETTINGS_MAIL_TEST_LIMIT:20}
      secret-rotation-per-day: ${ADMIN_SETTINGS_SECRET_ROTATE_LIMIT:10}
      count-failed-mail-tests: ${ADMIN_SETTINGS_COUNT_FAILED_MAIL_TESTS:false}
  production:
    bootstrap:
      enabled: ${PRODUCTION_BOOTSTRAP_ENABLED:true}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: true
  show-actuator: true
  packages-to-scan: com.xdev.ooms

info:
  app:
    name: ZitFlow
    version: ${app.version:0.0.0}
    git-sha: ${app.git.sha:unknown}
    built-at: ${app.built.at:unknown}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db
          show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  config: classpath:logback-spring.xml
  level:
    com.xdev.ooms: INFO
    com.xdev.ooms.security: INFO
    org.springframework.security: INFO
    org.springframework.security.oauth2: INFO
    org.springframework.web: ${LOG_LEVEL_WEB:INFO}
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web.client.RestTemplate: ${LOG_LEVEL_REST:WARN}
