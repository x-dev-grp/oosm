# Legacy path — use deploy/vps/docker-compose.yml for production VPS installs.
# This file mirrors the VPS stack for convenience when working from the repo root.

services:
  postgres:
    image: postgres:16-alpine
    container_name: oosm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osm}
      POSTGRES_USER: ${DB_USER:-osm}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-osm} -d ${POSTGRES_DB:-osm}']
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - osm

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/x-dev-grp/OOSM-backend:release-latest}
    container_name: oosm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8084
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB:-osm}}
      DB_USER: ${DB_USER:-osm}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      JWT_ISSUER_URI: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      JWK_SET_URI: http://backend:8084/oauth2/jwks
      INTERNAL_BASE_URL: http://backend:8084
      FRONTEND_ENTRY_POINT: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET:-unused}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SECURITY_BOOTSTRAP_ENABLED: ${SECURITY_BOOTSTRAP_ENABLED:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
    expose:
      - '8084'
    healthcheck:
      test: ['CMD-SHELL', 'curl --fail --silent http://127.0.0.1:8084/actuator/health/liveness > /dev/null || exit 1']
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s
    networks:
      - osm

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/x-dev-grp/oosm-frontend:release-latest}
    container_name: oosm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8084
    ports:
      - '${WEB_PORT:-80}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - osm

networks:
  osm:
    driver: bridge

volumes:
  postgres_data:
