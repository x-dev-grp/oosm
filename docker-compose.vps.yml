services:
  backend:
    image: ${BACKEND_IMAGE:-oosm-backend:latest}
    container_name: oosm-backend
    restart: unless-stopped
    environment:
      SERVER_PORT: 8084
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      HIBERNATE_DDL_AUTO: ${HIBERNATE_DDL_AUTO:-update}
      SHOW_SQL: ${SHOW_SQL:-false}
      JWT_ISSUER_URI: ${PUBLIC_APP_URL}
      JWK_SET_URI: http://localhost:8084/oauth2/jwks
      FRONTEND_ENTRY_POINT: ${PUBLIC_APP_URL}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${PUBLIC_APP_URL}
      OAUTH2_CLIENT_SECRET: ${OAUTH2_CLIENT_SECRET}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_API_KEY: ${ONESIGNAL_API_KEY:-}
    expose:
      - "8084"
    networks:
      - oosm

  frontend:
    image: ${FRONTEND_IMAGE:-oosm-frontend:latest}
    container_name: oosm-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      PORT: 8080
      BACKEND_URL: http://backend:8084
    ports:
      - "${WEB_PORT:-80}:8080"
    networks:
      - oosm

networks:
  oosm:
    driver: bridge
