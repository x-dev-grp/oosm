# Railway config-as-code for the backend service.
# Postgres service must be named "Postgres" (Railway default), or change references below.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health/liveness"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Database reference variables are NOT supported in railway.toml (Railway schema: build + deploy only).
# Use scripts/railway-link-postgres.sh or railway-db.references — see RAILWAY_TESTING.md.
