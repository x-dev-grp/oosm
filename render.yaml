services:
  - type: web
    name: oosm-api
    runtime: docker
    repo: https://github.com/x-dev-grp/oosm
    branch: pfe-v2-final
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -XX:+UseSerialGC -Xms64m -Xmx256m -Xss512k -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=48m -XX:MaxDirectMemorySize=32m -XX:+ExitOnOutOfMemoryError
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: SPRING_APP_NAME
        sync: false
      - key: HIBERNATE_DDL_AUTO
        value: update
      - key: HIBERNATE_ALLOW_JDBC_METADATA_ACCESS
        value: "false"
      - key: JPA_REPOSITORY_BOOTSTRAP_MODE
        value: lazy
      - key: DB_MAJOR_VERSION
        value: "17"
      - key: DB_MINOR_VERSION
        value: "0"
      - key: SHOW_SQL
        value: "false"
      - key: FORMAT_SQL
        value: "false"
      # Lazy init keeps context refresh under Render's ~5 min port-scan timeout on 512MiB free tier.
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
      # Schema scripts run once on a fresh DB; skip on every Render redeploy to save startup time.
      - key: SPRING_SQL_INIT_MODE
        value: never
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: SPRING_JMX_ENABLED
        value: "false"
      - key: DB_POOL_MAX_SIZE
        value: "3"
      - key: DB_POOL_MIN_IDLE
        value: "1"
      - key: DB_CONNECTION_TIMEOUT
        value: "30000"
      - key: DB_VALIDATION_TIMEOUT
        value: "5000"
      - key: DB_INITIALIZATION_FAIL_TIMEOUT
        value: "10000"
      - key: DB_IDLE_TIMEOUT
        value: "300000"
      - key: DB_MAX_LIFETIME
        value: "900000"
      - key: TOMCAT_MAX_THREADS
        value: "20"
      - key: TOMCAT_MIN_SPARE_THREADS
        value: "2"
      - key: TOMCAT_MAX_CONNECTIONS
        value: "100"
      - key: TOMCAT_ACCEPT_COUNT
        value: "50"
      # SPRINGDOC_ENABLED: Administration → Settings → Diagnostics (not set here)
      - key: SEARCH_DEBUG_ON_STARTUP
        value: "false"
      - key: FRONTEND_ENTRY_POINT
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: OAUTH2_CLIENT_ID
        sync: false
      - key: OAUTH2_CLIENT_SECRET
        sync: false
      - key: SECURITY_BOOTSTRAP_ENABLED
        value: "true"
      - key: SECURITY_BOOTSTRAP_USERNAME
        sync: false
      - key: SECURITY_BOOTSTRAP_PASSWORD
        sync: false
      - key: SECURITY_BOOTSTRAP_EMAIL
        sync: false
      - key: SECURITY_BOOTSTRAP_PHONE
        sync: false
      - key: APP_SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: OOSM
      - key: MAIL_SUPPORT_EMAIL
        sync: false
      - key: MAIL_ENABLED
        value: "true"
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_API_KEY
        sync: false
      - key: ONESIGNAL_ENDPOINT
        value: https://onesignal.com/api/v1/notifications
      - key: QR_BASE_URL
        sync: false
      - key: SERVER_ERROR_INCLUDE_MESSAGE
        value: never
      - key: SERVER_ERROR_INCLUDE_BINDING_ERRORS
        value: never
      - key: HEALTH_SHOW_DETAILS
        value: never
      - key: LOG_LEVEL_WEB
        value: INFO
      - key: LOG_LEVEL_REST
        value: WARN
