services:
  - type: web
    name: oosm-api
    runtime: docker
    repo: https://github.com/x-dev-grp/oosm
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: free
    autoDeployTrigger: off
    healthCheckPath: /actuator/health/liveness
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: SPRING_APP_NAME
        sync: false
      - key: HIBERNATE_DDL_AUTO
        value: update
      - key: SHOW_SQL
        value: "false"
      - key: FRONTEND_ENTRY_POINT
        sync: false
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        sync: false
      - key: OAUTH2_CLIENT_ID
        sync: false
      - key: OAUTH2_CLIENT_SECRET
        sync: false
      - key: SECURITY_BOOTSTRAP_ENABLED
        value: "true"
      - key: SECURITY_BOOTSTRAP_USERNAME
        sync: false
      - key: SECURITY_BOOTSTRAP_PASSWORD
        sync: false
      - key: SECURITY_BOOTSTRAP_EMAIL
        sync: false
      - key: SECURITY_BOOTSTRAP_PHONE
        sync: false
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      - key: MAIL_SMTP_AUTH
        value: "true"
      - key: MAIL_STARTTLS
        value: "true"
      - key: MAIL_TIMEOUT
        value: "5000"
      - key: MAIL_CONN_TIMEOUT
        value: "5000"
      - key: ONESIGNAL_APP_ID
        sync: false
      - key: ONESIGNAL_API_KEY
        sync: false
      - key: ONESIGNAL_ENDPOINT
        value: https://onesignal.com/api/v1/notifications
      - key: QR_BASE_URL
        sync: false
      - key: SERVER_ERROR_INCLUDE_MESSAGE
        value: never
      - key: SERVER_ERROR_INCLUDE_BINDING_ERRORS
        value: never
      - key: HEALTH_SHOW_DETAILS
        value: never
      - key: LOG_LEVEL_WEB
        value: INFO
      - key: LOG_LEVEL_REST
        value: WARN
