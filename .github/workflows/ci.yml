name: Backend CI

on:
  push:
    branches: [main, develop, release, pfe-v2-final]
  pull_request:
    branches: [main, develop, release, pfe-v2-final]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VERSION matches Maven POM
        run: |
          test -f VERSION
          V=$(tr -d '\r\n' < VERSION)
          P=$(node -e "const fs=require('fs');const p=fs.readFileSync('pom.xml','utf8');const m=p.match(/<artifactId>oosm-monolith-parent<\\/artifactId>\\s*<version>([^<]+)<\\/version>/);if(!m||m[1]!==process.argv[1]){console.error('VERSION ('+process.argv[1]+') != pom.xml ('+(m?m[1]:'?')+')');process.exit(1)}" "$V")

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B verify -pl app -am

      - name: Upload JAR artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: oosm-monolith-jar
          path: app/target/oosm-monolith.jar
          retention-days: 3
